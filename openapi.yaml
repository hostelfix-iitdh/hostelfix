components:
  schemas:
    AssetCreate:
      properties:
        hostel_id:
          type: integer
          exclusiveMinimum: 0.0
          title: Hostel Id
        name:
          type: string
          maxLength: 120
          minLength: 2
          title: Name
        asset_type:
          type: string
          maxLength: 80
          minLength: 2
          title: Asset Type
        description:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Description
        location_ids:
          items:
            type: integer
          type: array
          title: Location Ids
      type: object
      required:
      - hostel_id
      - name
      - asset_type
      title: AssetCreate
    AssetLocationLink:
      properties:
        location_id:
          type: integer
          exclusiveMinimum: 0.0
          title: Location Id
      type: object
      required:
      - location_id
      title: AssetLocationLink
    AssetPatch:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 120
            minLength: 2
          - type: 'null'
          title: Name
        asset_type:
          anyOf:
          - type: string
            maxLength: 80
            minLength: 2
          - type: 'null'
          title: Asset Type
        description:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Description
      type: object
      title: AssetPatch
    Body_smart_draft_api_v1_issues_draft_post:
      properties:
        text:
          type: string
          title: Text
          default: ''
        image:
          anyOf:
          - type: string
            contentMediaType: application/octet-stream
          - type: 'null'
          title: Image
      type: object
      title: Body_smart_draft_api_v1_issues_draft_post
    CategoryCreate:
      properties:
        name:
          type: string
          maxLength: 80
          minLength: 2
          title: Name
        description:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Description
        resolution_target_hours:
          type: integer
          maximum: 8760.0
          minimum: 1.0
          title: Resolution Target Hours
          default: 168
      type: object
      required:
      - name
      title: CategoryCreate
    CategoryPatch:
      properties:
        description:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Description
        resolution_target_hours:
          anyOf:
          - type: integer
            maximum: 8760.0
            minimum: 1.0
          - type: 'null'
          title: Resolution Target Hours
      type: object
      title: CategoryPatch
    ChangePassword:
      properties:
        current_password:
          type: string
          maxLength: 128
          minLength: 1
          title: Current Password
        new_password:
          type: string
          maxLength: 128
          minLength: 5
          title: New Password
      type: object
      required:
      - current_password
      - new_password
      title: ChangePassword
    FloorCreate:
      properties:
        hostel_id:
          type: integer
          exclusiveMinimum: 0.0
          title: Hostel Id
        floor_number:
          type: integer
          maximum: 100.0
          minimum: 0.0
          title: Floor Number
      type: object
      required:
      - hostel_id
      - floor_number
      title: FloorCreate
    GoogleIn:
      properties:
        credential:
          type: string
          maxLength: 10000
          minLength: 20
          title: Credential
      type: object
      required:
      - credential
      title: GoogleIn
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HostelCreate:
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 2
          title: Name
      type: object
      required:
      - name
      title: HostelCreate
    IssueCreate:
      properties:
        title:
          type: string
          maxLength: 180
          minLength: 5
          title: Title
        description:
          type: string
          maxLength: 5000
          minLength: 10
          title: Description
        location_id:
          type: integer
          exclusiveMinimum: 0.0
          title: Location Id
        problem_type_id:
          type: integer
          exclusiveMinimum: 0.0
          title: Problem Type Id
        asset_id:
          anyOf:
          - type: integer
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Asset Id
        room_label:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Room Label
        service_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Service Date
        is_public:
          type: boolean
          title: Is Public
          default: true
      type: object
      required:
      - title
      - description
      - location_id
      - problem_type_id
      title: IssueCreate
    IssueOut:
      properties:
        id:
          type: integer
          title: Id
        title:
          type: string
          title: Title
        description:
          type: string
          title: Description
        location_id:
          type: integer
          title: Location Id
        problem_type_id:
          type: integer
          title: Problem Type Id
        asset_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Asset Id
        status:
          type: string
          title: Status
        service_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Service Date
        is_public:
          type: boolean
          title: Is Public
        due_date:
          anyOf:
          - type: string
