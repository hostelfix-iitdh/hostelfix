[tool.ruff]
target-version = "py313"
line-length = 100

# The existing codebase contains compact one-line suites and semicolon-separated
# statements. Keep those legacy style rules non-blocking while still checking
# imports and the rest of Ruff's default correctness rules.
ignore = ["E701", "E702"]
extend-ignore = [
    "B008",
    "DTZ003",
    "TRY401",
    "BLE001"
]