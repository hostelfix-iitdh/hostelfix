  /api/v1/auth/register:
    post:
      summary: Register a student account
      description: Planned for MS-5. Student email must use the exact iitdh.ac.in domain.
      tags:
      - Authentication
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
        '409':
          $ref: '#/components/responses/Error'
        '422':
