openapi: 3.0.3
info:
  title: HostelFix API
  version: 1.0.0
  description: HostelFix API contract for MS-3. Implemented operations are backed by the current FastAPI
    service. Authentication, profile management, admin CRUD, and SmartReport-related operations marked
    as planned are part of the intended API contract for later milestones and are not all implemented
    in MS-3.
servers:
- url: http://localhost:8000
tags:
- name: System
- name: Locations
- name: Issues
- name: Staff
- name: Notifications
- name: Authentication
- name: Profile
- name: SmartReport
- name: Admin
paths:
  /api/v1/health:
    get:
      summary: Check API health
      description: Check API health.
      tags:
      - System
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          $ref: '#/components/responses/Error'
  /api/v1/hostels:
    get:
      summary: List hostels
      description: List hostels.
      tags:
      - Locations
      responses:
        '200':
          description: Paginated results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageHostel'
        '422':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: 1-based page number.
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
        description: Page size, capped at 50.
  /api/v1/hostels/{hostel_id}/floors:
    get:
      summary: List floors in a hostel
      description: List floors in a hostel.
      tags:
      - Locations
      responses:
        '200':
          description: Paginated results
          content:
