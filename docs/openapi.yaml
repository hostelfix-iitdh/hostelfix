components:
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - details
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: The request could not be completed.
            details:
              nullable: true
              description: Optional field-level or diagnostic details.
    Page:
      type: object
      required:
      - items
      - page
      - size
      - total
      properties:
        items:
          type: array
          items:
            type: object
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          minimum: 0
    Health:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          example: ok
    Hostel:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: integer
        name:
          type: string
    Floor:
      type: object
      required:
      - id
      - hostel_id
      - floor_number
      properties:
        id:
          type: integer
        hostel_id:
          type: integer
        floor_number:
          type: integer
    Wing:
      type: object
      required:
      - id
      - floor_id
      - wing_name
      properties:
        id:
          type: integer
        floor_id:
          type: integer
        wing_name:
          type: string
    Location:
      type: object
      required:
      - id
      - wing_id
      - area_type
      properties:
        id:
          type: integer
        wing_id:
          type: integer
        area_type:
          type: string
          enum:
          - toilet
          - bathroom
          - washing_machine_area
          - cloth_drying_area
          - corridor
          - lift_lobby
          - drinking_water_area
          - room
        description:
          type: string
          nullable: true
    LocationCreate:
      type: object
      required:
      - wing_id
      - area_type
      properties:
        wing_id:
          type: integer
        area_type:
          type: string
        description:
          type: string
          maxLength: 255
    Category:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
    CategoryCreate:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 255
    ProblemType:
      type: object
      required:
      - id
      - category_id
      - name
      - requires_description
      properties:
        id:
          type: integer
        category_id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        requires_description:
          type: boolean
    ProblemTypeCreate:
      type: object
      required:
      - category_id
      - name
      properties:
        category_id:
          type: integer
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 255
        requires_description:
          type: boolean
          default: false
    Asset:
      type: object
      required:
      - id
      - name
      - asset_type
      properties:
        id:
          type: integer
        name:
          type: string
        asset_type:
          type: string
        description:
          type: string
          nullable: true
    AssetCreate:
      type: object
      required:
      - hostel_id
      - name
      - asset_type
      properties:
        hostel_id:
          type: integer
        name:
          type: string
          maxLength: 120
        asset_type:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 255
    IssueCreate:
      type: object
      required:
      - title
      - description
      - location_id
      - problem_type_id
      properties:
        title:
          type: string
          minLength: 5
          maxLength: 180
        description:
          type: string
          minLength: 10
          maxLength: 5000
        location_id:
          type: integer
          minimum: 1
        problem_type_id:
          type: integer
          minimum: 1
        room_label:
          type: string
          maxLength: 80
          nullable: true
        service_date:
          type: string
          format: date
          nullable: true
        is_public:
          type: boolean
          default: true
    IssuePatch:
      type: object
      properties:
        title:
          type: string
          minLength: 5
          maxLength: 180
        description:
          type: string
          minLength: 10
          maxLength: 5000
        location_id:
          type: integer
          minimum: 1
        problem_type_id:
          type: integer
          minimum: 1
        room_label:
          type: string
          maxLength: 80
          nullable: true
        service_date:
          type: string
          format: date
          nullable: true
        is_public:
          type: boolean
    Issue:
      type: object
      required:
      - id
      - title
      - description
      - location_id
      - problem_type_id
      - status
      - is_public
      - created_at
      - updated_at
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        location_id:
          type: integer
        problem_type_id:
          type: integer
        status:
          type: string
          enum:
          - submitted
          - acknowledged
