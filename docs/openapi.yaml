      tags: [Authentication]
      summary: Register student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterIn'
      responses:
        '201': {description: Registration successful}
        '409': {description: Account already exists}
  /api/v1/auth/login:
