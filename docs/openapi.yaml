        '422':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      security:
      - cookieAuth: []
      parameters:
      - name: issue_id
        in: path
        required: true
        description: Resource identifier.
        schema:
          type: integer
          minimum: 1
    delete:
      summary: Withdraw complaint confirmation
      description: Withdraw complaint confirmation.
      tags:
      - Issues
      responses:
        '204':
          description: Operation completed; no response body.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      security:
      - cookieAuth: []
      parameters:
      - name: issue_id
        in: path
        required: true
        description: Resource identifier.
        schema:
          type: integer
          minimum: 1
  /api/v1/issues/{issue_id}/resolution-feedback:
