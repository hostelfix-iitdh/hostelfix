      - cookieAuth: []
  /api/v1/users/me/issues:
    get:
      summary: List the current user’s complaints
      description: Planned for MS-4/MS-5. Includes the reporter’s own room label.
      tags:
      - Profile
      responses:
        '200':
          description: Paginated results
          content:
