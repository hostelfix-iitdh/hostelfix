  /api/v1/issues:
    get:
      summary: List public issues
      description: List public issues.
      tags:
      - Issues
      responses:
        '200':
          description: Paginated results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageIssue'
        '422':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: 1-based page number.
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
        description: Page size, capped at 50.
      - name: status
        in: query
        schema:
          type: string
          enum:
          - submitted
          - acknowledged
          - in_progress
          - resolved
          - closed
          - reopened
      - name: location_id
        in: query
        schema:
          type: integer
          minimum: 1
      - name: problem_type_id
        in: query
        schema:
          type: integer
          minimum: 1
      - name: q
        in: query
        schema:
          type: string
          maxLength: 100
    post:
      summary: Submit a complaint
      description: Submit a complaint.
      tags:
      - Issues
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueCreate'
  /api/v1/issues/{issue_id}:
