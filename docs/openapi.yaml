      parameters:
      - name: hostel_id
        in: path
        required: true
        description: Resource identifier.
        schema:
          type: integer
          minimum: 1
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: 1-based page number.
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
        description: Page size, capped at 50.
