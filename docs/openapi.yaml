      responses:
        '200': {description: Password reset}
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Logout
      responses:
        '204': {description: Logged out}
  /api/v1/issues/draft:
    post:
      tags: [SmartReport AI]
      summary: Generate an editable SmartReport draft from text and optional image
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                text:
                  type: string
                  maxLength: 500
                image:
                  type: string
                  format: binary
      responses:
        '200': {description: AI draft}
        '503': {description: AI unavailable; manual reporting remains available}
        '504': {description: AI timeout}
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    IssueCreate:
      properties:
        title:
          type: string
          maxLength: 180
          minLength: 5
          title: Title
        description:
          type: string
          maxLength: 5000
          minLength: 10
          title: Description
        location_id:
          type: integer
          exclusiveMinimum: 0.0
          title: Location Id
        problem_type_id:
          type: integer
          exclusiveMinimum: 0.0
          title: Problem Type Id
        room_label:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Room Label
        service_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Service Date
        is_public:
          type: boolean
          title: Is Public
          default: true
      type: object
      required:
      - title
      - description
      - location_id
      - problem_type_id
      title: IssueCreate
    IssueOut:
      properties:
        id:
          type: integer
          title: Id
        title:
          type: string
          title: Title
        description:
          type: string
          title: Description
        location_id:
          type: integer
          title: Location Id
        problem_type_id:
          type: integer
          title: Problem Type Id
        status:
          type: string
          title: Status
        service_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Service Date
        is_public:
          type: boolean
          title: Is Public
        due_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Due Date
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - title
      - description
      - location_id
      - problem_type_id
      - status
      - service_date
      - is_public
      - due_date
      - created_at
      - updated_at
      title: IssueOut
    IssuePatch:
      properties:
        title:
          anyOf:
          - type: string
            maxLength: 180
            minLength: 5
          - type: 'null'
          title: Title
        description:
          anyOf:
          - type: string
            maxLength: 5000
            minLength: 10
          - type: 'null'
          title: Description
        location_id:
          anyOf:
          - type: integer
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Location Id
        problem_type_id:
          anyOf:
          - type: integer
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Problem Type Id
        room_label:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Room Label
        service_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Service Date
        is_public:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Public
      type: object
      title: IssuePatch
    MarkRead:
      properties:
        is_read:
          type: boolean
          title: Is Read
          default: true
      type: object
      title: MarkRead
    NotificationOut:
      properties:
        id:
          type: integer
          title: Id
        user_id:
          type: integer
          title: User Id
        issue_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Issue Id
        title:
          type: string
          title: Title
        message:
          type: string
          title: Message
        is_read:
          type: boolean
          title: Is Read
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - user_id
      - issue_id
      - title
      - message
      - is_read
      - created_at
      title: NotificationOut
    ResolutionFeedbackCreate:
      properties:
        outcome:
          type: string
          pattern: ^(resolved|not_resolved|reopen_requested)$
          title: Outcome
        comment:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Comment
      type: object
      required:
      - outcome
      title: ResolutionFeedbackCreate
    StaffCreate:
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 2
          title: Name
        email:
          type: string
          maxLength: 255
          minLength: 5
          title: Email
        category_id:
          type: integer
          exclusiveMinimum: 0.0
          title: Category Id
      type: object
      required:
      - name
      - email
      - category_id
      title: StaffCreate
    StaffIssueOut:
      properties:
        id:
          type: integer
          title: Id
        title:
          type: string
          title: Title
        description:
          type: string
          title: Description
        location_id:
          type: integer
          title: Location Id
        problem_type_id:
          type: integer
          title: Problem Type Id
        status:
          type: string
          title: Status
        service_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Service Date
        is_public:
          type: boolean
          title: Is Public
        due_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Due Date
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        room_label:
          anyOf:
          - type: string
          - type: 'null'
          title: Room Label
      type: object
      required:
      - id
      - title
      - description
      - location_id
      - problem_type_id
      - status
      - service_date
      - is_public
      - due_date
      - created_at
      - updated_at
      - room_label
      title: StaffIssueOut
    StatusUpdate:
      properties:
        status:
          type: string
          pattern: ^(submitted|acknowledged|in_progress|resolved|closed|rejected|reopened)$
          title: Status
        comment:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Comment
        is_internal:
          type: boolean
          title: Is Internal
          default: false
      type: object
      required:
      - status
      title: StatusUpdate
    RegisterIn:
      type: object
      required: [name, email, password, consent]
      properties:
        name: {type: string, minLength: 2, maxLength: 120}
        email: {type: string, format: email}
        password: {type: string, minLength: 10, maxLength: 128}
        consent: {type: boolean}
    LoginIn:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, minLength: 1}
    GoogleIn:
      type: object
      required: [credential]
      properties:
        credential: {type: string, minLength: 20}
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
