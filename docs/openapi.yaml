            schema:
              $ref: '#/components/schemas/ProfilePatch'
    delete:
      summary: Delete the current account
      description: Planned for MS-5. Complaint records are anonymised rather than deleted.
      tags:
      - Profile
      responses:
        '204':
          description: Operation completed; no response body.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
