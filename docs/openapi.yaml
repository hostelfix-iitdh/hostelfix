      description: Planned for MS-5.
      tags:
      - Authentication
      responses:
        '204':
          description: Operation completed; no response body.
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      security:
      - cookieAuth: []
  /api/v1/auth/google:
    post:
      summary: Sign in with Google
      description: Planned for MS-5. The backend verifies the Google ID token and college domain.
      tags:
