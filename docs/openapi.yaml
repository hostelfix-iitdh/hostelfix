        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      parameters:
      - name: issue_id
        in: path
        required: true
        description: Resource identifier.
        schema:
          type: integer
          minimum: 1
    patch:
      summary: Edit own eligible complaint
      description: Edit own eligible complaint.
      tags:
      - Issues
      responses:
        '200':
          description: Successful response
          content:
            application/json:
