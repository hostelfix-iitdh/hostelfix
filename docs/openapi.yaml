      summary: Request a password reset
      description: Planned for MS-5. Response does not disclose whether an account exists.
      tags:
      - Authentication
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResult'
        '422':
