name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hostelfix_test
          MYSQL_USER: hostelfix
          MYSQL_PASSWORD: hostelfix_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Lint with Ruff
        run: ruff check app tests
      - name: Run unit and integration tests
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
        run: python -m pytest -m 'not e2e' --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=70
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Start HostelFix
        run: docker compose up -d --build
        env:
          SESSION_SECRET: ci_session_secret_which_is_long_enough_123456789
          MYSQL_PASSWORD: hostelfix_ci_password
          MYSQL_ROOT_PASSWORD: root_ci_password
          GOOGLE_CLIENT_ID: ""
          GEMINI_API_KEY: ""
      - name: Wait for frontend
        run: |
          for i in $(seq 1 60); do
            curl --fail --silent http://localhost:8080/ && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Run Playwright E2E tests
        env:
          HOSTELFIX_URL: http://localhost:8080
        run: python -m pytest tests/e2e -m e2e -q
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop services
        if: always()
        run: docker compose down -v
