services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hostelfix}
      MYSQL_USER: ${MYSQL_USER:-hostelfix}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hostelfix_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u${MYSQL_USER:-hostelfix}", "-p${MYSQL_PASSWORD:-hostelfix_dev_password}"]
      interval: 5s
      timeout: 5s
      retries: 30
  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-hostelfix}:${MYSQL_PASSWORD:-hostelfix_dev_password}@db:3306/${MYSQL_DATABASE:-hostelfix}?charset=utf8mb4
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173,http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:-CHANGE_ME_SESSION_SECRET_32_CHARS_MINIMUM}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
      AI_MAX_CHARS: ${AI_MAX_CHARS:-500}
      AI_MAX_IMAGE_BYTES: ${AI_MAX_IMAGE_BYTES:-5242880}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-1}
      MAIL_MODE: ${MAIL_MODE:-log}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && if [ \"$${SEED_ON_STARTUP}\" = \"true\" ]; then python -m app.seed; fi && uvicorn app.main:app --host 0.0.0.0 --port 8000"
  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
volumes:
  mysql_data:
